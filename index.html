<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotós Kincskereső</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            background: #1a1a2e; 
            color: #fff; 
            padding: 10px; 
            margin: 0; 
        }
        h1 { 
            color: #00d2fc; 
            margin: 10px 0 5px 0; 
            font-size: 22px; 
        }
        #szint-jelzo { 
            font-size: 16px; 
            color: #ffbc00; 
            font-weight: bold; 
            margin-bottom: 10px; 
        }
        /* A 1080x1440-es (3:4) álló formátumra optimalizált képkeret */
        .kep-keret { 
            width: 85%; 
            max-width: 340px; /* Telefonokon ideális szélesség */
            aspect-ratio: 3 / 4; /* Kényszerített 3:4-es álló arány */
            margin: 0 auto; 
            border: 4px solid #fff; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 8px 16px rgba(0,0,0,0.5); 
            background: #333; 
        }
        .kep-keret img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; /* Torzításmentesen vágja és illeszti be a képet */
        }
        #tavolsag { 
            font-size: 38px; 
            font-weight: bold; 
            margin: 15px 0; 
            color: #4caf50; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.5); 
        }
        #statusz { 
            font-size: 15px; 
            color: #bbb; 
            min-height: 40px; 
            padding: 0 10px; 
            margin-bottom: 15px;
        }
        .btn { 
            background: #00d2fc; 
            border: none; 
            padding: 15px 40px; 
            color: #1a1a2e; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 30px; 
            box-shadow: 0 4px 10px rgba(0,210,252,0.4); 
        }
        .btn:active { 
            transform: scale(0.98); 
        }
        .siker-ablak { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: rgba(0,0,0,0.9); 
            justify-content: center; 
            align-items: center; 
            flex-direction: column; 
            z-index: 100; 
        }
        .siker-content { 
            animation: pop 0.5s ease-in-out; 
            text-align: center; 
        }
        @keyframes pop { 
            0% { transform: scale(0.5); } 
            100% { transform: scale(1); } 
        }
    </style>
</head>
<body>

    <h1>Épület Vadászat</h1>
    <div id="szint-jelzo">1 / 3 Épület</div>
    
    <div class="kep-keret">
        <img id="epulet-kep" src="kepek/epulet1.jpg" alt="Keresendő épület">
    </div>
    
    <div id="tavolsag">--- m</div>
    <div id="statusz">Nyomd meg az indítás gombot a játékhoz!</div>
    
    <button id="start-btn" class="btn" onclick="inditJatek()">JÁTÉK INDÍTÁSA</button>

    <div id="siker-képernyő" class="siker-ablak">
        <div class="siker-content">
            <h1 style="color: #4caf50; font-size: 40px;">MEGVAN! 🎉</h1>
            <p style="font-size: 20px;">Szuper ügyes vagy!</p>
            <br>
            <button class="btn" style="background: #4caf50; color: white;" onclick="kovetkezoSzint()">KÖVETKEZŐ ÉPÜLET ➔</button>
        </div>
    </div>

<script>
// =========================================================================
// IDE ÍRD BE AZ ÉPÜLETEK ADATAIT!
// A 'kep' legyen a fájl neve (pl. epulet1.jpg), a 'lat' és 'lon' pedig a koordináták.
// Bármennyi pontot hozzáadhatsz a mintát követve (vesszővel elválasztva).
// =========================================================================
const KINCSEK = [
    { kep: "epulet1.JPG", lat: 46.6832, lon: 21.0988 }, // 1. Épület koordinátái
    { kep: "epulet2.jpg", lat: 46.6833, lon: 21.0975 }, // 2. Épület koordinátái
    { kep: "epulet3.JPG", lat: 46.6823, lon: 21.0975 }  // 3. Épület koordinátái
];

let aktualisSzint = 0;
let gpsWatcher = null;

// Haversine formula (távolságmérés a Föld görbületét figyelembe véve)
function tavolsagSzamitas(lat1, lon1, lat2, lon2) {
    const R = 6371e3; // Föld sugara méterben
    const fi1 = lat1 * Math.PI/180;
    const fi2 = lat2 * Math.PI/180;
    const deltaFi = (lat2-lat1) * Math.PI/180;
    const deltaLambda = (lon2-lon1) * Math.PI/180;

    const a = Math.sin(deltaFi/2) * Math.sin(deltaFi/2) +
              Math.cos(fi1) * Math.cos(fi2) *
              Math.sin(deltaLambda/2) * Math.sin(deltaLambda/2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    return R * c; 
}

function inditJatek() {
    if (!navigator.geolocation) {
        alert("A telefonod nem támogatja a GPS-t.");
        return;
    }

    document.getElementById("start-btn").style.display = "none";
    frissitKepernyo();

    // GPS folyamatos, valós idejű követése offline módban is
    gpsWatcher = navigator.geolocation.watchPosition(
        (position) => {
            const aktLat = position.coords.latitude;
            const aktLon = position.coords.longitude;
            const cel = KINCSEK[aktualisSzint];

            const tav = tavolsagSzamitas(aktLat, aktLon, cel.lat, cel.lon);
            
            // Távolság kiírása egész méterre kerekítve
            document.getElementById("tavolsag").innerText = Math.round(tav) + " m";
            document.getElementById("statusz").innerText = "Keressétek a képen látható épületet! A távolságmérő segít.";

            // Ha 15 méteren belülre érnek a gyerekek (Sikeres találat)
            if (tav <= 15) {
                document.getElementById("siker-képernyő").style.display = "flex";
            }
        },
        (error) => {
            document.getElementById("statusz").innerText = "GPS Hiba: Győződj meg róla, hogy a helymeghatározás be van kapcsolva a telefonodon!";
        },
        { 
            enableHighAccuracy: true, // Maximális műholdas pontosság kikényszerítése
            maximumAge: 0, 
            timeout: 10000 
        }
    );
}

function frissitKepernyo() {
    const cel = KINCSEK[aktualisSzint];
    document.getElementById("szint-jelzo").innerText = (aktualisSzint + 1) + " / " + KINCSEK.length + " Épület";
    document.getElementById("epulet-kep").src = cel.kep;
    document.getElementById("tavolsag").innerText = "--- m";
}

function kovetkezoSzint() {
    document.getElementById("siker-képernyő").style.display = "none";
    
    if (aktualisSzint < KINCSEK.length - 1) {
        aktualisSzint++;
        frissitKepernyo();
    } else {
        // Ha elérték az utolsó épületet is, vége a játéknak
        document.getElementById("szint-jelzo").innerText = "JÁTÉK VÉGE";
        document.getElementById("epulet-kep").style.display = "none";
        document.getElementById("tavolsag").innerText = "🏆";
        document.getElementById("statusz").innerHTML = "<strong style='color:#ffbc00; font-size:20px;'>Minden épületet megtaláltatok! Szuper kincskeresők vagytok!</strong>";
        if(gpsWatcher) navigator.geolocation.clearWatch(gpsWatcher);
    }
}
</script>
</body>
</html>
